name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check release versions
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v8
        with:
          name: javascript-packages
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: php-package
          path: release
      - run: npm ci
      - name: Publish JavaScript packages
        run: npm publish --workspace=@trafficops/template-language --workspace=@trafficops/template-editor-monaco --workspace=@trafficops/template-editor-core --workspace=@trafficops/template-editor-shell --workspace=@trafficops/cli --access public --provenance
      - name: Attach downloadable packages
        run: gh release create "$GITHUB_REF_NAME" release/dist/*.tgz release/vscode-extension/dist/*.vsix release/*.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
