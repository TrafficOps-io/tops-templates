name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Check release versions
        run: node scripts/check-release.mjs "${GITHUB_REF_NAME#v}"
      - uses: actions/download-artifact@v4
        with:
          name: javascript-packages
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: php-package
          path: release
      - name: Publish CLI
        run: npm publish release/dist/*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Attach downloadable packages
        run: gh release create "$GITHUB_REF_NAME" release/dist/*.tgz release/vscode-extension/dist/*.vsix release/*.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Update Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: python3 scripts/update-packagist.py
