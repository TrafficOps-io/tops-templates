name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, intl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check
      - run: composer archive --format=zip --dir=dist --file=trafficops-template-dsl
      - uses: actions/upload-artifact@v7
        if: matrix.php == '8.4'
        with:
          name: php-package
          path: dist/*.zip
  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix docs
      - run: npm run docs:build
      - run: npm run test:pack --workspace=@trafficops/cli
      - run: npm run build:vsix
      - run: mkdir -p dist
      - run: npm pack --workspace=@trafficops/cli --pack-destination=dist
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22'
        with:
          name: javascript-packages
          path: |
            dist/*.tgz
            vscode-extension/dist/*.vsix
      - uses: actions/upload-artifact@v7
        if: matrix.node == '22'
        with:
          name: editor
          path: editor/dist
  formatter-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, intl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: node --test runtime/test/php-parity.test.js
      - run: npm run test:runtime --workspace=tops-templates
      - run: xvfb-run -a npm run test:integration --workspace=tops-templates
