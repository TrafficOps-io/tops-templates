<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">TrafficOps template pipeline</title>
  <desc id="desc">Template source flows through the safe runtime and becomes static HTML and assets.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ff8068" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff8068"/>
      <stop offset="1" stop-color="#ff9677"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="638" height="498" rx="15" fill="#1d1a19" stroke="#4a3d38"/>
  <rect x="1" y="1" width="638" height="498" rx="15" fill="url(#grid)"/>
  <path d="M1 57.5H639" stroke="#3b3430"/>
  <text x="25" y="35" fill="#b7aaa2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2.2">TEMPLATE PIPELINE</text>
  <circle cx="568" cy="29" r="3" fill="#ff8068"/>
  <text x="579" y="34" fill="#ff8068" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.8">LIVE</text>

  <g filter="url(#shadow)">
    <rect x="25" y="87" width="590" height="98" rx="11" fill="#24201e" stroke="#4a3d38"/>
    <rect x="42" y="105" width="62" height="62" rx="9" fill="#2b2422" stroke="#5a443e"/>
    <path d="M61 123h18l8 8v18H61z" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M79 123v9h8" fill="none" stroke="#ff9677" stroke-width="2"/>
    <text x="123" y="130" fill="#f7f0eb" font-family="Onest, Arial, sans-serif" font-size="18" font-weight="600">Template source</text>
    <text x="123" y="153" fill="#8d817a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.4">PARAMS · BLOCKS · CONDITIONS · ASSETS</text>
    <rect x="523" y="115" width="72" height="34" rx="7" fill="#1b1817" stroke="#3b3430"/>
    <text x="541" y="136" fill="#ff9677" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">.TPL</text>
  </g>

  <path d="M320 185v35" stroke="#5a4a44"/>
  <rect x="288" y="198" width="64" height="24" rx="4" fill="#181514" stroke="#3b3430"/>
  <text x="300" y="214" fill="#b7aaa2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.3">PARSE</text>

  <g filter="url(#shadow)">
    <rect x="25" y="221" width="590" height="112" rx="11" fill="#262220" stroke="#63483f"/>
    <rect x="42" y="242" width="62" height="70" rx="9" fill="#302521" stroke="#714b42"/>
    <path d="M73 257l16 9v19l-16 9-16-9v-19z" fill="none" stroke="url(#accent)" stroke-width="2"/>
    <path d="M66 274l5 5 10-12" fill="none" stroke="#ff9677" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="123" y="266" fill="#ff9677" font-family="Onest, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">TRAFFICOPS</text>
    <text x="123" y="291" fill="#f7f0eb" font-family="Onest, Arial, sans-serif" font-size="20" font-weight="600">Safe runtime</text>
    <text x="422" y="267" fill="#8d817a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.1">EXPLICIT POLICY</text>
    <text x="422" y="289" fill="#8d817a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.1">TYPED VALUES</text>
    <text x="422" y="311" fill="#8d817a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.1">SAFE HTML</text>
  </g>

  <path d="M320 333v35" stroke="#5a4a44"/>
  <rect x="285" y="346" width="70" height="24" rx="4" fill="#181514" stroke="#3b3430"/>
  <text x="297" y="362" fill="#b7aaa2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.3">RENDER</text>

  <rect x="25" y="369" width="590" height="73" rx="11" fill="#211e1c" stroke="#4a3d38"/>
  <text x="47" y="398" fill="#f7f0eb" font-family="Onest, Arial, sans-serif" font-size="16" font-weight="600">Static output</text>
  <text x="47" y="420" fill="#8d817a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2">ORDINARY FILES · DEPLOY ANYWHERE</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="middle">
    <rect x="403" y="388" width="58" height="30" rx="6" fill="#2a2421" stroke="#4a3d38"/>
    <text x="432" y="407" fill="#ff9677">HTML</text>
    <rect x="470" y="388" width="58" height="30" rx="6" fill="#2a2421" stroke="#4a3d38"/>
    <text x="499" y="407" fill="#ff9677">ASSETS</text>
    <rect x="537" y="388" width="58" height="30" rx="6" fill="#ff8068"/>
    <text x="566" y="407" fill="#241f1d" font-weight="700">ZIP</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.2" text-anchor="middle">
    <text x="135" y="474" fill="#8d817a">CLI</text>
    <circle cx="198" cy="471" r="2" fill="#ff8068"/>
    <text x="270" y="474" fill="#8d817a">PHP API</text>
    <circle cx="349" cy="471" r="2" fill="#ff8068"/>
    <text x="451" y="474" fill="#8d817a">BROWSER STUDIO</text>
  </g>
</svg>
